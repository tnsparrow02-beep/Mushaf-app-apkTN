name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Organize files
        run: |
          mkdir -p public assets native public/fonts
          for f in index.html styles.css app.js sw.js manifest.json icon.svg icon-512.png privacy.html; do [ -f "$f" ] && mv "$f" public/ || true; done
          for f in icon-only.png icon-foreground.png icon-background.png; do [ -f "$f" ] && mv "$f" assets/ || true; done
          B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL "$B/amiriquran/AmiriQuran-Regular.ttf" -o public/fonts/AmiriQuran-Regular.ttf || true
          for w in Regular Medium Bold; do curl -fsSL "$B/tajawal/Tajawal-$w.ttf" -o "public/fonts/Tajawal-$w.ttf" || true; done
          ls public assets

      - name: Write native Android files
        run: |
          cat > native/MediaCtlPlugin.java <<'EOF_MEDIACTLPLUGIN_JAVA'
          package com.mushaf.app;

          import android.content.Intent;
          import android.os.Build;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import java.util.ArrayList;

          @CapacitorPlugin(name = "MediaCtl")
          public class MediaCtlPlugin extends Plugin {
              public static MediaCtlPlugin inst;

              @Override
              public void load() {
                  super.load();
                  inst = this;
              }

              public static void emit(String action) {
                  if (inst != null) {
                      JSObject ret = new JSObject();
                      ret.put("action", action);
                      inst.notifyListeners("action", ret);
                  }
              }

              private String[] toArr(JSArray arr) {
                  if (arr == null) return new String[0];
                  try {
                      JSONArray ja = arr;
                      String[] res = new String[ja.length()];
                      for (int i = 0; i < ja.length(); i++) {
                          res[i] = ja.getString(i);
                      }
                      return res;
                  } catch (Exception e) {
                      return new String[0];
                  }
              }

              @PluginMethod
              public void handoff(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), MediaService.class);
                      intent.setAction("handoff");
                      intent.putExtra("base", call.getString("base", ""));
                      intent.putExtra("n", call.getInt("n", 1));
                      intent.putExtra("pos", call.getInt("pos", 0));
                      intent.putExtra("rate", call.getFloat("rate", 1.0f));
                      intent.putExtra("names", toArr(call.getArray("names")));
                      intent.putExtra("rec", call.getString("rec", ""));
                      intent.putExtra("title", call.getString("title", ""));
                      intent.putExtra("text", call.getString("text", ""));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(intent);
                      } else {
                          getContext().startService(intent);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("handoff failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void handoffAy(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), MediaService.class);
                      intent.setAction("handoffAy");
                      intent.putExtra("urls", toArr(call.getArray("urls")));
                      intent.putExtra("ai", call.getInt("ai", 1));
                      intent.putExtra("rp", call.getInt("rp", 1));
                      intent.putExtra("loop", call.getBoolean("loop", false));
                      intent.putExtra("lf", call.getInt("lf", 1));
                      intent.putExtra("lt", call.getInt("lt", 1));
                      intent.putExtra("rate", call.getFloat("rate", 1.0f));
                      intent.putExtra("stitle", call.getString("stitle", ""));
                      intent.putExtra("rec", call.getString("rec", ""));
                      intent.putExtra("title", call.getString("title", ""));
                      intent.putExtra("text", call.getString("text", ""));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(intent);
                      } else {
                          getContext().startService(intent);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("handoff failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void takeback(PluginCall call) {
                  if (MediaService.inst != null) {
                      MediaService.inst.takeBack(call);
                  } else {
                      JSObject ret = new JSObject();
                      ret.put("ok", false);
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void update(PluginCall call) {
                  if (MediaService.inst != null) {
                      MediaService.inst.update(
                          call.getString("title", ""),
                          call.getString("text", ""),
                          call.getBoolean("playing", false)
                      );
                  }
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), MediaService.class);
                      getContext().stopService(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("stop failed: " + e.getMessage());
                  }
              }
          }
          EOF_MEDIACTLPLUGIN_JAVA
          cat > native/MediaService.java <<'EOF_MEDIASERVICE_JAVA'
          package com.mushaf.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.MediaMetadata;
          import android.media.MediaPlayer;
          import android.media.PlaybackParams;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PluginCall;
          import java.util.Locale;

          public class MediaService extends Service {
              public static final String CH = "mushaf_media";
              public static final int ID = 42;
              public static MediaService inst;

              private MediaPlayer mp;
              private MediaSession session;
              private boolean playing = false;
              private boolean ay = false;
              private boolean loop = false;
              private boolean nat = false;
              private int sn = 1;
              private int ai = 1;
              private int rp = 1;
              private int rdone = 0;
              private int lf = 1;
              private int lt = 1;
              private float rate = 1.0f;
              private String base = "";
              private String rec = "";
              private String title = "";
              private String text = "";
              private String stitle = "";
              private String[] names = new String[0];
              private String[] urls = new String[0];

              @Override
              public void onCreate() {
                  super.onCreate();
                  inst = this;
                  createNotificationChannel();
                  initSession();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null && nm.getNotificationChannel(CH) == null) {
                          NotificationChannel nc = new NotificationChannel(CH, "تلاوة القرآن الكريم", NotificationManager.IMPORTANCE_LOW);
                          nc.setDescription("تشغيل التلاوة في الخلفية وعند إغلاق الشاشة");
                          nc.setShowBadge(false);
                          nc.setSound(null, null);
                          nc.enableVibration(false);
                          nm.createNotificationChannel(nc);
                      }
                  }
              }

              private void initSession() {
                  try {
                      session = new MediaSession(this, "MushafMedia");
                      session.setCallback(new MediaSession.Callback() {
                          @Override
                          public void onPlay() { doAct("play"); }
                          @Override
                          public void onPause() { doAct("pause"); }
                          @Override
                          public void onSkipToNext() { doAct("next"); }
                          @Override
                          public void onSkipToPrevious() { doAct("prev"); }
                          @Override
                          public void onStop() { doAct("stop"); }
                      });
                      session.setActive(true);
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      String act = intent.getAction();
                      if ("handoff".equals(act)) {
                          ay = false;
                          base = intent.getStringExtra("base");
                          sn = intent.getIntExtra("n", 1);
                          int pos = intent.getIntExtra("pos", 0);
                          rate = intent.getFloatExtra("rate", 1.0f);
                          String[] nms = intent.getStringArrayExtra("names");
                          if (nms != null) names = nms;
                          rec = intent.getStringExtra("rec");
                          title = intent.getStringExtra("title");
                          text = intent.getStringExtra("text");
                          startNat(pos);
                      } else if ("handoffAy".equals(act)) {
                          ay = true;
                          String[] u = intent.getStringArrayExtra("urls");
                          if (u != null) urls = u;
                          ai = intent.getIntExtra("ai", 1);
                          rp = intent.getIntExtra("rp", 1);
                          loop = intent.getBooleanExtra("loop", false);
                          lf = intent.getIntExtra("lf", 1);
                          lt = intent.getIntExtra("lt", urls.length);
                          rate = intent.getFloatExtra("rate", 1.0f);
                          stitle = intent.getStringExtra("stitle");
                          rec = intent.getStringExtra("rec");
                          title = intent.getStringExtra("title");
                          text = intent.getStringExtra("text");
                          rdone = 0;
                          startAy();
                      } else if ("play".equals(act) || "pause".equals(act) || "next".equals(act) || "prev".equals(act) || "stop".equals(act)) {
                          doAct(act);
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void startNat(int pos) {
                  relMp();
                  playN(sn, pos);
              }

              private void playN(int n, int pos) {
                  sn = n;
                  if (base == null || base.isEmpty()) return;
                  String url = String.format(Locale.US, "%s%03d.mp3", base, n);
                  playUrl(url, pos);
              }

              private void startAy() {
                  relMp();
                  playA(ai);
              }

              private void playA(int idx) {
                  ai = idx;
                  if (urls == null || idx < 1 || idx > urls.length) {
                      onEnd();
                      return;
                  }
                  title = stitle + " — الآية " + ai;
                  text = rec + " · حفظ" + (rp > 1 ? " · تكرار " + (rdone + 1) + "/" + rp : "");
                  playUrl(urls[idx - 1], 0);
              }

              private void playUrl(String url, int pos) {
                  try {
                      relMp();
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .build());
                      mp.setDataSource(url);
                      mp.setOnPreparedListener(player -> {
                          if (pos > 0) player.seekTo(pos);
                          setSpeed(rate);
                          player.start();
                          playing = true;
                          show();
                      });
                      mp.setOnCompletionListener(player -> onEnd());
                      mp.setOnErrorListener((player, what, extra) -> {
                          relMp();
                          playing = false;
                          show();
                          return true;
                      });
                      mp.prepareAsync();
                  } catch (Exception e) {
                      relMp();
                      playing = false;
                      show();
                  }
              }

              private void setSpeed(float r) {
                  if (mp != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          PlaybackParams params = mp.getPlaybackParams();
                          params.setSpeed(r);
                          mp.setPlaybackParams(params);
                      } catch (Exception ignored) {}
                  }
              }

              private void onEnd() {
                  if (ay) {
                      rdone++;
                      if (rdone < rp) {
                          playA(ai);
                          return;
                      }
                      rdone = 0;
                      int to = loop ? lt : (urls != null ? urls.length : 1);
                      if (ai < to) {
                          playA(ai + 1);
                      } else if (loop) {
                          playA(lf);
                      } else {
                          playing = false;
                          show();
                      }
                  } else {
                      if (sn < 114) {
                          playN(sn + 1, 0);
                      } else {
                          playing = false;
                          show();
                      }
                  }
              }

              private void doAct(String act) {
                  if ("play".equals(act)) {
                      if (mp != null) {
                          mp.start();
                          playing = true;
                          show();
                      }
                      MediaCtlPlugin.emit("play");
                  } else if ("pause".equals(act)) {
                      if (mp != null) {
                          mp.pause();
                          playing = false;
                          show();
                      }
                      MediaCtlPlugin.emit("pause");
                  } else if ("stop".equals(act)) {
                      relMp();
                      playing = false;
                      stopForeground(true);
                      stopSelf();
                      MediaCtlPlugin.emit("stop");
                  } else if ("next".equals(act)) {
                      if (ay) {
                          rdone = 0;
                          if (urls != null && ai < urls.length) playA(ai + 1);
                      } else {
                          if (sn < 114) playN(sn + 1, 0);
                      }
                      MediaCtlPlugin.emit("next");
                  } else if ("prev".equals(act)) {
                      if (ay) {
                          rdone = 0;
                          if (ai > 1) playA(ai - 1);
                      } else {
                          if (sn > 1) playN(sn - 1, 0);
                      }
                      MediaCtlPlugin.emit("prev");
                  }
              }

              private void show() {
                  try {
                      updateSession();
                      Notification n = buildNotification();
                      startForeground(ID, n);
                  } catch (Exception ignored) {}
              }

              public void update(String t, String txt, boolean pl) {
                  if (t != null && !t.isEmpty()) this.title = t;
                  if (txt != null && !txt.isEmpty()) this.text = txt;
                  this.playing = pl;
                  show();
              }

              private void updateSession() {
                  if (session == null) return;
                  try {
                      session.setMetadata(new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, text)
                          .build());
                      session.setPlaybackState(new PlaybackState.Builder()
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                              mp != null ? mp.getCurrentPosition() : 0, rate)
                          .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE |
                              PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_STOP)
                          .build());
                  } catch (Exception ignored) {}
              }

              private Notification buildNotification() {
                  Notification.Builder b = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      ? new Notification.Builder(this, CH)
                      : new Notification.Builder(this);

                  b.setContentTitle(title)
                   .setContentText(text)
                   .setSmallIcon(R.drawable.ic_stat_mushaf)
                   .setOngoing(playing)
                   .setShowWhen(false)
                   .setOnlyAlertOnce(true);

                  PackageManager pm = getPackageManager();
                  Intent launch = pm.getLaunchIntentForPackage(getPackageName());
                  if (launch != null) {
                      PendingIntent pi = PendingIntent.getActivity(this, 0, launch,
                          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0));
                      b.setContentIntent(pi);
                  }

                  b.addAction(act("prev", "السابق", android.R.drawable.ic_media_previous));
                  if (playing) {
                      b.addAction(act("pause", "إيقاف مؤقت", android.R.drawable.ic_media_pause));
                  } else {
                      b.addAction(act("play", "تشغيل", android.R.drawable.ic_media_play));
                  }
                  b.addAction(act("next", "التالي", android.R.drawable.ic_media_next));
                  b.addAction(act("stop", "إغلاق", android.R.drawable.ic_menu_close_clear_cancel));

                  if (session != null) {
                      Notification.MediaStyle ms = new Notification.MediaStyle();
                      ms.setMediaSession(session.getSessionToken());
                      ms.setShowActionsInCompactView(0, 1, 2);
                      b.setStyle(ms);
                  }

                  return b.build();
              }

              private Notification.Action act(String action, String label, int icon) {
                  Intent i = new Intent(this, MediaService.class);
                  i.setAction(action);
                  PendingIntent pi = PendingIntent.getService(this, action.hashCode(), i,
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0));
                  return new Notification.Action.Builder(icon, label, pi).build();
              }

              public void takeBack(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("ok", true);
                  ret.put("ay", this.ay);
                  ret.put("n", this.ay ? this.ai : this.sn);
                  ret.put("pos", safePos());
                  ret.put("playing", this.playing);

                  relMp();
                  playing = false;
                  stopForeground(true);
                  stopSelf();
                  call.resolve(ret);
              }

              private int safePos() {
                  if (mp != null) {
                      try { return mp.getCurrentPosition(); } catch (Exception ignored) {}
                  }
                  return 0;
              }

              private void relMp() {
                  if (mp != null) {
                      try {
                          mp.stop();
                          mp.release();
                      } catch (Exception ignored) {}
                      mp = null;
                  }
              }

              @Override
              public void onDestroy() {
                  relMp();
                  if (session != null) {
                      try { session.release(); } catch (Exception ignored) {}
                      session = null;
                  }
                  inst = null;
                  super.onDestroy();
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  if (!playing) {
                      stopSelf();
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF_MEDIASERVICE_JAVA
          cat > native/MainActivity.java <<'EOF_MAINACTIVITY_JAVA'
          package com.mushaf.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaCtlPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF_MAINACTIVITY_JAVA
          cat > native/ic_stat_mushaf.xml <<'EOF_IC_STAT_MUSHAF_XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,6.5C10.5,5.6 8.6,5 6.5,5 4.9,5 3.4,5.3 2,6v13c1.4,-0.7 2.9,-1 4.5,-1 2.1,0 4,0.6 5.5,1.5 1.5,-0.9 3.4,-1.5 5.5,-1.5 1.6,0 3.1,0.3 4.5,1V6c-1.4,-0.7 -2.9,-1 -4.5,-1 -2.1,0 -4,0.6 -5.5,1.5z"/>
          </vector>
          EOF_IC_STAT_MUSHAF_XML
          cat > native/manifest.py <<'EOF_MANIFEST_PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf8").read()
          perms = ["POST_NOTIFICATIONS", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK",
                   "SCHEDULE_EXACT_ALARM", "WAKE_LOCK", "ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION"]
          add = "".join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if 'android.permission.%s"' % x not in s)
          if 'android.hardware.location.gps' not in s:
              add += '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          if add:
              s = s.replace("<application", add + "    <application", 1)
          if "MediaService" not in s:
              s = s.replace("</application>",
                            '        <service android:name=".MediaService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>', 1)
          open(p, "w", encoding="utf8").write(s)
          EOF_MANIFEST_PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm install
      - run: npx cap add android
      - name: App icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Version
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"4.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK (with notification player, fallback without)
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          PKGDIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          MAIN="$PKGDIR/MainActivity.java"
          mkdir -p android/app/src/main/res/drawable
          cp native/ic_stat_mushaf.xml android/app/src/main/res/drawable/ic_stat_mushaf.xml
          python3 native/manifest.py android/app/src/main/AndroidManifest.xml
          cp "$MAIN" "$RUNNER_TEMP/MainActivity.bak"
          for f in MediaCtlPlugin MediaService MainActivity; do sed "s/__PKG__/$APPID/g" "native/$f.java" > "$PKGDIR/$f.java"; done
          cd android && chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "::warning::Notification player failed, building without it"
            rm -f "../$PKGDIR/MediaCtlPlugin.java" "../$PKGDIR/MediaService.java"
            cp "$RUNNER_TEMP/MainActivity.bak" "../$MAIN"
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
