<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4c38"/>
      <stop offset="100%" stop-color="#072219"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- 8-Pointed Star Ornament (Rub el Hizb) -->
  <g stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.35">
    <rect x="146" y="146" width="220" height="220" rx="12"/>
    <rect x="146" y="146" width="220" height="220" rx="12" transform="rotate(45 256 256)"/>
    <circle cx="256" cy="256" r="140" stroke-dasharray="8 8"/>
  </g>

  <!-- Quran Stand (Rihal) -->
  <g stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="150" y1="365" x2="362" y2="295"/>
    <line x1="362" y1="365" x2="150" y2="295"/>
  </g>

  <!-- Open Quran Pages -->
  <path d="M 256 310 C 215 325 155 315 120 290 L 120 180 C 155 205 215 215 256 200 Z" fill="#fffdf5" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 256 310 C 297 325 357 315 392 290 L 392 180 C 357 205 297 215 256 200 Z" fill="#fffdf5" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Script lines on pages -->
  <g stroke="#c29d2b" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <line x1="145" y1="218" x2="235" y2="230"/>
    <line x1="145" y1="242" x2="235" y2="254"/>
    <line x1="145" y1="266" x2="235" y2="278"/>
    
    <line x1="277" y1="230" x2="367" y2="218"/>
    <line x1="277" y1="254" x2="367" y2="242"/>
    <line x1="277" y1="278" x2="367" y2="266"/>
  </g>

  <!-- Book Spine Center -->
  <line x1="256" y1="200" x2="256" y2="310" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Top Crescent and Star -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <path d="M 256 120 A 30 30 0 1 0 286 150 A 24 24 0 1 1 256 120 Z"/>
    <polygon points="274,124 278,134 288,134 280,140 283,150 274,144 265,150 268,140 260,134 270,134"/>
  </g>
</svg>
